<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="X-O Battle">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/00f0ff/0d1117?text=XO">
    <link id="manifest" rel="manifest" href="">
    <title>X-O Battle</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --primary-color: #58a6ff;
            --accent-x: #00f0ff;
            --accent-o: #ff0055;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --glow-x: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.4);
            --glow-o: 0 0 10px rgba(255, 0, 85, 0.6), 0 0 20px rgba(255, 0, 85, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 500px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 60px; /* Space for footer */
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            padding: 20px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .screen.active {
            display: flex;
        }

        h1.title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--surface-color);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1f6feb, #388bfd);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(31, 111, 235, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: var(--border-color);
            box-shadow: none;
            cursor: not-allowed;
            color: var(--text-muted);
        }

        #install-btn {
            background: linear-gradient(135deg, #2ea043, #3fb950);
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.4);
            margin-top: 15px;
            display: none; /* Hidden by default until PWA is ready */
        }
        
        #install-btn.show {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        .scoreboard {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }

        .player-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 33%;
        }

        .player-score.active p {
            color: white;
            font-weight: bold;
        }

        .player-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .score-val {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .score-x { color: var(--accent-x); text-shadow: var(--glow-x); }
        .score-o { color: var(--accent-o); text-shadow: var(--glow-o); }
        
        .round-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: white;
            font-weight: 600;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .cell {
            background-color: var(--surface-color);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.3s;
            user-select: none;
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.x {
            color: var(--accent-x);
            text-shadow: var(--glow-x);
        }

        .cell.o {
            color: var(--accent-o);
            text-shadow: var(--glow-o);
        }

        .cell.win {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: white;
            animation: pulse 1s infinite alternate;
        }

        .status-msg {
            text-align: center;
            font-size: 1.2rem;
            margin: 20px 0;
            min-height: 28px;
            color: white;
            font-weight: bold;
        }

        .result-container {
            text-align: center;
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .final-winner {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            text-align: left;
        }

        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            from { box-shadow: 0 0 10px rgba(255,255,255,0.2); }
            to { box-shadow: 0 0 20px rgba(255,255,255,0.6); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <h1 class="title">X-O Battle</h1>
            
            <div class="input-group">
                <label for="p1-name">Player 1 (X)</label>
                <input type="text" id="p1-name" placeholder="Enter name" value="Player 1" maxlength="12">
            </div>

            <div class="input-group">
                <label for="p2-name">Player 2 (O)</label>
                <input type="text" id="p2-name" placeholder="Enter name" value="Player 2" maxlength="12">
            </div>

            <div class="input-group">
                <label for="round-select">Number of Rounds</label>
                <select id="round-select">
                    <option value="1">1 Round</option>
                    <option value="3" selected>3 Rounds</option>
                    <option value="5">5 Rounds</option>
                    <option value="6">6 Rounds</option>
                    <option value="10">10 Rounds</option>
                    <option value="15">15 Rounds</option>
                    <option value="20">20 Rounds</option>
                    <option value="25">25 Rounds</option>
                    <option value="50">50 Rounds</option>
                    <option value="custom">Custom...</option>
                </select>
            </div>

            <div class="input-group hidden" id="custom-round-group">
                <label for="custom-round">Custom Rounds</label>
                <input type="number" id="custom-round" placeholder="e.g. 7" min="1" max="999">
            </div>

            <button class="btn" id="start-btn">Start Game</button>
            <button class="btn" id="install-btn">📱 Install App</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="round-info" id="round-display">Round 1 / 3</div>
            
            <div class="scoreboard">
                <div class="player-score" id="p1-card">
                    <span class="player-name" id="score-p1-name">Player 1</span>
                    <span class="score-val score-x" id="score-p1-val">0</span>
                </div>
                <div class="player-score">
                    <span class="player-name">Draws</span>
                    <span class="score-val" id="score-draws" style="color: var(--text-muted)">0</span>
                </div>
                <div class="player-score" id="p2-card">
                    <span class="player-name" id="score-p2-name">Player 2</span>
                    <span class="score-val score-o" id="score-p2-val">0</span>
                </div>
            </div>

            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="status-msg" id="status-msg">Player 1's Turn (X)</div>

            <button class="btn hidden" id="next-round-btn">Next Round</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h1 class="title">Series Over</h1>
            
            <div class="result-container">
                <div class="final-winner" id="final-winner-msg">Player 1 Wins!</div>
                <div class="stats-grid">
                    <div style="color: var(--text-muted)">Total Rounds:</div>
                    <div id="stat-rounds" style="text-align: right; font-weight: bold;">3</div>
                    
                    <div style="color: var(--accent-x)" id="stat-p1-name">Player 1 Wins:</div>
                    <div id="stat-p1-wins" style="text-align: right; font-weight: bold; color: white;">2</div>
                    
                    <div style="color: var(--accent-o)" id="stat-p2-name">Player 2 Wins:</div>
                    <div id="stat-p2-wins" style="text-align: right; font-weight: bold; color: white;">1</div>
                    
                    <div style="color: var(--text-muted)">Draws:</div>
                    <div id="stat-draws" style="text-align: right; font-weight: bold; color: white;">0</div>
                </div>
            </div>

            <button class="btn" id="play-again-btn" style="margin-bottom: 10px;">Play Again</button>
            <button class="btn" id="home-btn" style="background: var(--surface-color); border: 2px solid var(--border-color);">Back to Home</button>
        </div>

        <footer>
            Developed by <a href="https://github.com/SachinDhisle04" target="_blank" rel="noopener noreferrer">SachinDhisle04</a>
        </footer>
    </div>

    <script>
        // Game State
        let player1 = "Player 1";
        let player2 = "Player 2";
        let totalRounds = 3;
        let currentRound = 1;
        
        let p1Wins = 0;
        let p2Wins = 0;
        let draws = 0;
        
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X"; // "X" or "O"
        let roundStartPlayer = "X"; // Alternates every round
        let gameActive = false;

        // DOM Elements - Setup
        const setupScreen = document.getElementById('setup-screen');
        const roundSelect = document.getElementById('round-select');
        const customRoundGroup = document.getElementById('custom-round-group');
        const customRoundInput = document.getElementById('custom-round');
        const startBtn = document.getElementById('start-btn');

        // DOM Elements - Game
        const gameScreen = document.getElementById('game-screen');
        const roundDisplay = document.getElementById('round-display');
        const scoreP1Name = document.getElementById('score-p1-name');
        const scoreP2Name = document.getElementById('score-p2-name');
        const scoreP1Val = document.getElementById('score-p1-val');
        const scoreP2Val = document.getElementById('score-p2-val');
        const scoreDraws = document.getElementById('score-draws');
        const p1Card = document.getElementById('p1-card');
        const p2Card = document.getElementById('p2-card');
        const cells = document.querySelectorAll('.cell');
        const statusMsg = document.getElementById('status-msg');
        const nextRoundBtn = document.getElementById('next-round-btn');

        // DOM Elements - Result
        const resultScreen = document.getElementById('result-screen');
        const finalWinnerMsg = document.getElementById('final-winner-msg');
        const statRounds = document.getElementById('stat-rounds');
        const statP1Name = document.getElementById('stat-p1-name');
        const statP2Name = document.getElementById('stat-p2-name');
        const statP1Wins = document.getElementById('stat-p1-wins');
        const statP2Wins = document.getElementById('stat-p2-wins');
        const statDraws = document.getElementById('stat-draws');
        const playAgainBtn = document.getElementById('play-again-btn');
        const homeBtn = document.getElementById('home-btn');
        const installBtn = document.getElementById('install-btn');

        const pwaManifest = {
            "name": "X-O Battle",
            "short_name": "X-O Battle",
            "description": "Premium Tic-Tac-Toe Game",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#0d1117",
            "theme_color": "#0d1117",
            "icons": [
                {
                    "src": "https://placehold.co/192x192/00f0ff/0d1117?text=XO",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://placehold.co/512x512/00f0ff/0d1117?text=XO",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        
        // Dynamically create manifest link for current environment
        const manifestBlob = new Blob([JSON.stringify(pwaManifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.getElementById('manifest').setAttribute('href', manifestUrl);

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Update UI notify the user they can install the PWA
            installBtn.classList.add('show');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
                installBtn.classList.remove('show');
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.classList.remove('show');
            deferredPrompt = null;
            console.log('PWA was installed');
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Will try to register sw.js if it exists (useful for prod deployment)
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker registration failed (Expected in dynamic environment): ', err));
            });
        }

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // Events
        roundSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customRoundGroup.classList.remove('hidden');
            } else {
                customRoundGroup.classList.add('hidden');
            }
        });

        startBtn.addEventListener('click', () => {
            player1 = document.getElementById('p1-name').value.trim() || "Player 1";
            player2 = document.getElementById('p2-name').value.trim() || "Player 2";
            
            let selectedRounds = roundSelect.value;
            if (selectedRounds === 'custom') {
                let customVal = parseInt(customRoundInput.value);
                if (!customVal || customVal < 1) {
                    alert("Please enter a valid number of rounds."); // Fallback, though UI constraint minimizes this
                    customVal = 1;
                }
                totalRounds = customVal;
            } else {
                totalRounds = parseInt(selectedRounds);
            }

            initSeries();
            switchScreen(setupScreen, gameScreen);
        });

        function initSeries() {
            currentRound = 1;
            p1Wins = 0;
            p2Wins = 0;
            draws = 0;
            roundStartPlayer = "X";
            
            scoreP1Name.innerText = player1;
            scoreP2Name.innerText = player2;
            updateScoreBoard();
            
            startNewRound();
        }

        function startNewRound() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = roundStartPlayer;
            gameActive = true;
            
            roundDisplay.innerText = `Round ${currentRound} / ${totalRounds}`;
            nextRoundBtn.classList.add('hidden');
            
            cells.forEach(cell => {
                cell.innerText = "";
                cell.className = "cell"; // reset classes
            });
            
            updateTurnDisplay();
        }

        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                const index = cell.getAttribute('data-index');
                if (boardState[index] !== "" || !gameActive) return;

                boardState[index] = currentPlayer;
                cell.innerText = currentPlayer;
                cell.classList.add(currentPlayer.toLowerCase());
                
                checkRoundResult();
            });
        });

        function updateTurnDisplay() {
            if (!gameActive) return;
            
            if (currentPlayer === "X") {
                statusMsg.innerText = `${player1}'s Turn (X)`;
                statusMsg.style.color = "var(--accent-x)";
                statusMsg.style.textShadow = "var(--glow-x)";
                p1Card.classList.add('active');
                p2Card.classList.remove('active');
            } else {
                statusMsg.innerText = `${player2}'s Turn (O)`;
                statusMsg.style.color = "var(--accent-o)";
                statusMsg.style.textShadow = "var(--glow-o)";
                p2Card.classList.add('active');
                p1Card.classList.remove('active');
            }
        }

        function checkRoundResult() {
            let roundWon = false;
            let winningCells = [];

            for (let i = 0; i < winConditions.length; i++) {
                const [a, b, c] = winConditions[i];
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    roundWon = true;
                    winningCells = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                gameActive = false;
                winningCells.forEach(index => cells[index].classList.add('win'));
                
                if (currentPlayer === "X") {
                    p1Wins++;
                    statusMsg.innerText = `${player1} wins the round!`;
                } else {
                    p2Wins++;
                    statusMsg.innerText = `${player2} wins the round!`;
                }
                endRoundSequence();
                return;
            }

            let roundDraw = !boardState.includes("");
            if (roundDraw) {
                gameActive = false;
                draws++;
                statusMsg.innerText = "Round ended in a Draw!";
                statusMsg.style.color = "white";
                statusMsg.style.textShadow = "none";
                endRoundSequence();
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            updateTurnDisplay();
        }

        function endRoundSequence() {
            updateScoreBoard();
            p1Card.classList.remove('active');
            p2Card.classList.remove('active');
            
            if (currentRound >= totalRounds) {
                nextRoundBtn.innerText = "Finish Series";
            } else {
                nextRoundBtn.innerText = "Next Round";
            }
            nextRoundBtn.classList.remove('hidden');
        }

        function updateScoreBoard() {
            scoreP1Val.innerText = p1Wins;
            scoreP2Val.innerText = p2Wins;
            scoreDraws.innerText = draws;
        }

        nextRoundBtn.addEventListener('click', () => {
            if (currentRound >= totalRounds) {
                showFinalResults();
            } else {
                currentRound++;
                roundStartPlayer = roundStartPlayer === "X" ? "O" : "X";
                startNewRound();
            }
        });

        function showFinalResults() {
            statRounds.innerText = totalRounds;
            statP1Name.innerText = `${player1} Wins:`;
            statP2Name.innerText = `${player2} Wins:`;
            statP1Wins.innerText = p1Wins;
            statP2Wins.innerText = p2Wins;
            statDraws.innerText = draws;

            if (p1Wins > p2Wins) {
                finalWinnerMsg.innerText = `🏆 ${player1} Wins Series!`;
                finalWinnerMsg.style.color = "var(--accent-x)";
                finalWinnerMsg.style.textShadow = "var(--glow-x)";
            } else if (p2Wins > p1Wins) {
                finalWinnerMsg.innerText = `🏆 ${player2} Wins Series!`;
                finalWinnerMsg.style.color = "var(--accent-o)";
                finalWinnerMsg.style.textShadow = "var(--glow-o)";
            } else {
                finalWinnerMsg.innerText = `🤝 Series Drawn!`;
                finalWinnerMsg.style.color = "white";
                finalWinnerMsg.style.textShadow = "0 0 10px rgba(255,255,255,0.5)";
            }

            switchScreen(gameScreen, resultScreen);
        }

        playAgainBtn.addEventListener('click', () => {
            initSeries();
            switchScreen(resultScreen, gameScreen);
        });

        homeBtn.addEventListener('click', () => {
            switchScreen(resultScreen, setupScreen);
        });

        function switchScreen(from, to) {
            from.classList.remove('active');
            to.classList.add('active');
        }
    </script>
</body>
</html>
